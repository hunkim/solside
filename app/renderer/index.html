<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"><title>Solside</title></head><body>
<div id="app">
 <aside id="sidebar">
  <div class="brand"><img src="logo-mark.svg" alt=""><span>Sol<i>side</i></span></div>
  <button id="newtab" class="primary">+ 새 탭</button>
  <h4>북마크</h4><div id="bms" class="list"></div>
  <h4>최근 작업</h4><div id="tasks" class="list"></div>
 </aside>
 <main id="top">
  <div id="tabbar"></div>
  <div id="toolbar">
   <button id="back" title="뒤로">←</button><button id="fwd" title="앞으로">→</button><button id="reload" title="새로고침">⟳</button>
   <input id="addr" placeholder="URL 또는 검색어 입력" spellcheck="false"><button id="star" title="북마크">☆</button>
  </div>
 </main>
 <section id="panel">
  <div class="phead"><b>AI 어시스턴트</b><span id="model"></span><button id="gear" title="설정">⚙</button></div>
  <div id="settings" class="notice" hidden><label>UPSTAGE_API_KEY<input id="keyin" type="password" placeholder="up_..." autocomplete="off"></label><label>모델<input id="modelin" placeholder="solar-pro2"></label><div><button id="savecfg" class="primary">저장</button> <button id="clearkey">키 삭제</button></div></div>
  <div id="notice" class="notice" hidden></div>
  <div id="chat"></div>
  <div class="quick"><button id="sum">이 페이지 요약</button></div>
  <form id="form"><textarea id="q" rows="2" placeholder="페이지에 대해 묻거나 작업을 시키세요 (예: 검색창에 'electron' 입력)"></textarea><button class="primary">보내기</button></form>
 </section>
</div><script src="app.js"></script></body></html>
